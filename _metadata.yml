author: Marcelo Ventura Freire
# date: 2026-??-??
lang: pt-br
embed-resources: true
format: 
  revealjs:
    ###############################
    # formato da tela
    # tamanho da tela
    #######
    # ### formato default 1050x700
    # width: 1050
    # height: 700
    ### formato 1600x900
    width: 1600
    height: 900
    # ### formato 1920x1080
    # width: 1920
    # height: 1080
    ###############################
    # tema dos slides
    theme: blood
    ###############################
    # configurações dos slides
    slide-level: 3
    slide-number: c/t
    show-slide-number: speaker
    transition: none
    ###############################
    # rodapé com o logo do github e o endereço do repositório
    footer: |
